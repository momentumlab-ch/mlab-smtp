# Release-Automatik: prüft (bin/check.sh), baut und verifiziert dist/<slug>.zip, sobald main eine Version trägt, die noch kein Release hat.
# Läuft auch bei einem Tag v*.*.* und von Hand (Actions > Release > Run workflow).
# Der Slug ist der Repo-Name. Die Hauptdatei heisst <slug>.php, bei Themes style.css.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen und prüfen
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -f "$SLUG.php" ]; then HEADER="$SLUG.php"; else HEADER="style.css"; fi
          VERSION=$(grep -m1 -E '^[[:space:]*]*Version:' "$HEADER" | sed 's/.*Version:[[:space:]]*//; s/[[:space:]]*$//')
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            case "$ASSETS" in *"$SLUG.zip"*) echo "skip=true" >> "$GITHUB_OUTPUT" ;; esac
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.skip != 'true'
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, mysqli, mbstring
          tools: composer:v2

      - name: Abhängigkeiten und Testumgebung
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress
          bash tests/env/setup.sh

      # Alle Prüfungen vor jedem Release-Artefakt: Lint, PHPCS, Version (gegen Tag/Version), Tests, i18n, Plugin Check,
      # ZIP bauen und prüfen (inklusive Installationstest). Schlägt ein Schritt fehl oder wird einer übersprungen
      # (MLAB_CHECK_STRICT=1), bricht der Workflow ab und es entsteht weder Release noch Asset.
      - name: Prüfungen (bin/check.sh)
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MLAB_CHECK_STRICT: '1'
          MLAB_REQUIRE_LOCALES: '1'
        run: bash bin/check.sh "$VERSION"

      - name: Verifiziertes ZIP bereitstellen
        if: steps.version.outputs.skip != 'true'
        env:
          SLUG: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          [ -f "dist/$SLUG.zip" ] || { echo "::error::dist/$SLUG.zip fehlt nach bin/check.sh (Repo-Name muss dem Slug entsprechen)."; exit 1; }
          SIZE=$(stat -c%s "dist/$SLUG.zip")
          if [ "$SIZE" -gt 8388608 ]; then
            echo "::warning::ZIP ist grösser als 8 MB ($SIZE Bytes). Viele Hostings haben dort ein Upload-Limit."
          fi
          sha256sum "dist/$SLUG.zip"

      - name: Release anlegen oder ZIP ergänzen
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
          EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ZIP="$GITHUB_WORKSPACE/dist/$SLUG.zip"
          if [ "$EXISTS" = "true" ]; then
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi
          awk -v v="$VERSION" '
            /^## / { if (found) exit; x = $2; gsub(/[][]/, "", x); if (x == v) { found = 1; next } }
            found' CHANGELOG.md > "$RUNNER_TEMP/notes.md" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Änderungen: siehe CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
