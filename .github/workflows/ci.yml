name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the declared minimum (Requires PHP in the plugin header), 8.3 the version used for development.
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite, mysqli, mbstring
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: bash bin/lint.sh

      - name: PHPCS
        if: matrix.php == '8.3'
        run: bash bin/phpcs.sh

      - name: Testumgebung (WordPress + SQLite)
        run: bash tests/env/setup.sh

      - name: Unit- und Integrationstests
        run: bash bin/test.sh

  test-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.0', 'mariadb:10.11']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mlab_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mlab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized || mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MLAB_TEST_DB: mysql
      MLAB_MYSQL_HOST: 127.0.0.1:3306
      MLAB_MYSQL_NAME: mlab_test
      MLAB_MYSQL_USER: root
      MLAB_MYSQL_PASS: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, mysqli, mbstring
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: Testumgebung (WordPress + MySQL)
        run: bash tests/env/setup.sh

      - name: Unit- und Integrationstests auf MySQL (inklusive mysql-claim.php)
        timeout-minutes: 12
        run: bash bin/test.sh

      - name: Diagnose bei Fehler (Prozesse, Verbindungen, Sperren)
        if: failure()
        run: |
          ps -eo pid,etime,args | grep -E 'php|mysql' | grep -v grep | cut -c1-200 || true
          mysql -h 127.0.0.1 -uroot -proot -e 'SHOW FULL PROCESSLIST; SELECT * FROM information_schema.innodb_trx\G' 2>&1 | cut -c1-300 | head -60 || true

  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, pdo_sqlite, mysqli, mbstring
          tools: composer:v2
      - name: Abhängigkeiten und Testumgebung
        run: |
          composer install --no-interaction --no-progress
          bash tests/env/setup.sh
      - name: Vollständige Prüfungen ohne Veröffentlichung
        env:
          MLAB_CHECK_STRICT: '1'
          MLAB_REQUIRE_LOCALES: '1'
        run: bash bin/check.sh
